[project]
name = "jude-api"
version = "0.0.0"
description = "Jude domain API (FastAPI, /api/v1)."
requires-python = "==3.12.*"
dependencies = [
    "fastapi",
    "uvicorn",
    "psycopg[binary]",
    "jude-platform",
    "alembic>=1.20.1",
    "sqlalchemy>=2.1.9",
]

[project.scripts]
jude-migrate = "jude_api.db.migrate:main"
jude-openapi = "jude_api.contract:main"

[tool.uv.sources]
jude-platform = { workspace = true }

[build-system]
requires = ["uv_build>=0.10.6,<0.11"]
build-backend = "uv_build"
