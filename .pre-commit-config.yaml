# Local git hooks (XC-FND-04). Install once: `just hooks`
# Every hook calls the tool version pinned in uv.lock / pnpm-lock.yaml — no separate hook versions.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types_or: [python, pyi]

      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        types_or: [python, pyi]

      - id: mypy
        name: mypy --strict
        entry: uv run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: import-linter
        name: import-linter (layer contracts)
        entry: uv run --frozen lint-imports --no-cache
        language: system
        types_or: [python, pyi]
        pass_filenames: false

      - id: kernel-builtins
        name: kernel builtins (no I/O / dynamic code)
        entry: uv run --frozen python tools/archlint/kernel_builtins.py
        language: system
        files: ^packages/kernel/src/
        types: [python]

      - id: eslint
        name: eslint (web)
        entry: pnpm --filter @jude/web lint
        language: system
        files: ^apps/web/
        types_or: [ts, tsx, javascript, jsx]
        pass_filenames: false

      - id: prettier
        name: prettier (web)
        entry: pnpm --filter @jude/web format:check
        language: system
        files: ^apps/web/
        pass_filenames: false

      - id: tsc
        name: tsc --noEmit (web)
        entry: pnpm --filter @jude/web typecheck
        language: system
        files: ^apps/web/
        types_or: [ts, tsx]
        pass_filenames: false

      - id: commitlint
        name: commitlint (Conventional Commits + Task trailer)
        entry: pnpm exec commitlint --edit
        language: system
        stages: [commit-msg]
