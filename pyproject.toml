# Jude monorepo — Python workspace root (uv). Not a package itself.
# Python 3.12, linux/amd64 images (IDR-09). Lockfile: uv.lock.
[project]
name = "jude-workspace"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    "jude-kernel",
    "jude-platform",
    "jude-api",
    "jude-worker",
    "jude-storage-fake",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx2",
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "import-linter>=2.16",
    "pre-commit>=4.7.0",
    "hypothesis>=6.170.15",
    "pytest-cov>=7.1.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/kernel",
    "packages/platform",
    "services/api",
    "services/worker",
    "tools/storage_fake",
]

[tool.uv.sources]
jude-kernel = { workspace = true }
jude-platform = { workspace = true }
jude-api = { workspace = true }
jude-worker = { workspace = true }
jude-storage-fake = { workspace = true }

[tool.pytest.ini_options]
testpaths = [
    "packages/kernel/tests",
    "packages/platform/tests",
    "services/api/tests",
    "services/worker/tests",
    "tools/storage_fake/tests",
    "tools/lint_selftest/tests",
    "tools/ci_selftest/tests",
]
# Seeded-violation self-test needs the JS toolchain; run it explicitly: pytest -m lint_selftest
# Run explicitly: pytest -m integration (needs JUDE_TEST_ADMIN_URL; `just test-int` starts a server)
addopts = "-ra --strict-markers --import-mode=importlib -m 'not lint_selftest and not integration'"
markers = [
    "lint_selftest: seeded violations must fail each lint gate (XC-FND-04); needs uv + pnpm deps",
    "integration: needs a disposable Postgres server via JUDE_TEST_ADMIN_URL (XC-FND-05)",
    "determinism: golden hashes / bit-exact reproduction; CI stage 'determinism' (XC-FND-03)",
    "contract: API and schema contract checks; CI stage 'contract' (XC-FND-03, XC-FND-06)",
    "oracle: comparisons with non-shipped geometry oracles; nightly stage (TSK-OPS-07-C)",
    "security: security suite; nightly stage (TSK-OPS-02/03/12-C)",
    "e2e: end-to-end suite; nightly stage (TSK-OPS-08-C)",
    "performance: benchmark trend, report-only; nightly stage (XC-EXP-BM01)",
]

# ---------------------------------------------------------------------------
# Coding-standard tooling (XC-FND-04). Engineering lead decision 2026-11-17:
# ruff rule set below, line length 100, mypy --strict for every Python package.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = [
    "packages/kernel/src",
    "packages/platform/src",
    "services/api/src",
    "services/worker/src",
    "tools/storage_fake/src",
]
# docs/tools holds one-off planning generators, not product code.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S310"]  # assert is the pytest idiom; urlopen on 127.0.0.1 test servers
"tools/lint_selftest/**" = ["S101", "S603"]
"tools/ci_selftest/**" = ["S101"]
# Experiment harnesses run in throwaway, network-less containers: /tmp is their tmpfs and
# subprocess re-invokes the probe itself with fixed argv. Never shipped.
"infra/experiments/**" = ["S108", "S603"]  # runs the lint tools as subprocesses with fixed argv

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["jude_kernel", "jude_platform", "jude_api", "jude_worker", "jude_storage_fake"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = [
    "packages/kernel/src",
    "packages/kernel/tests",
    "packages/platform/src",
    "packages/platform/tests",
    "services/api/src",
    "services/api/tests",
    "services/worker/src",
    "services/worker/tests",
    "tools/storage_fake/src",
    "tools/storage_fake/tests",
    "tools/archlint",
    "tools/lint_selftest/tests",
    "tools/ci_selftest/tests",
]

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
ignore_missing_imports = true  # numba ships no type hints; kernel_jit restores typing

# Layer rules (TECHNICAL_DESIGN architecture; DEVELOPMENT_STANDARDS §5 kernel purity, IF-03).
[tool.importlinter]
root_packages = ["jude_kernel", "jude_platform", "jude_api", "jude_worker", "jude_storage_fake"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "kernel-pure"
name = "Kernel is pure: no file/OS/network I/O, clock, randomness, threads or DB access"
type = "forbidden"
source_modules = ["jude_kernel"]
forbidden_modules = [
    "os", "pathlib", "shutil", "tempfile", "glob", "socket", "ssl", "http", "urllib",
    "subprocess", "multiprocessing", "threading", "concurrent", "asyncio", "signal",
    "time", "datetime", "random", "secrets", "uuid", "sqlite3", "logging", "importlib",
    "psycopg", "fastapi", "starlette", "httpx", "httpx2",
]

[[tool.importlinter.contracts]]
id = "kernel-leaf"
name = "Kernel does not depend on services or dev tools"
type = "forbidden"
source_modules = ["jude_kernel"]
forbidden_modules = ["jude_platform", "jude_api", "jude_worker", "jude_storage_fake"]

[[tool.importlinter.contracts]]
id = "no-dev-fakes-in-services"
name = "Shipped services never import the dev-only storage fake"
type = "forbidden"
source_modules = ["jude_api", "jude_worker"]
forbidden_modules = ["jude_storage_fake"]

[[tool.importlinter.contracts]]
id = "api-worker-independent"
name = "API and worker talk only through the Postgres job queue, never by import"
type = "independence"
modules = ["jude_api", "jude_worker"]
