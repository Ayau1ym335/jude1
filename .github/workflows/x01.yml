# XC-EXP-01 (X-01, TD-03, TD-11, TQ-05, TQ-07): determinism and tie handling of candidate
# libraries. Builds the experiment image once, saves it as an artifact (the second host loads
# the very same image), runs 100 fresh processes plus the agreement/tie run on a GitHub-hosted
# runner. Manual, or on PRs that touch the experiment.
name: x01-library-determinism

on:
  pull_request:
    paths:
      - "infra/experiments/x01/**"
      - ".github/workflows/x01.yml"
  workflow_dispatch:
    inputs:
      runs:
        description: "Fresh processes"
        default: "100"

permissions:
  contents: read

jobs:
  x01:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build experiment image
        run: docker build --platform linux/amd64 -f infra/experiments/x01/Dockerfile -t jude-x01:exp .
      - name: Save image (for the second host)
        run: |
          mkdir -p out
          docker save jude-x01:exp | gzip -1 > out/x01-image.tar.gz
          docker image inspect --format '{{.Id}}' jude-x01:exp > out/x01-image-id.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x01-image
          path: |
            out/x01-image.tar.gz
            out/x01-image-id.txt
          retention-days: 30
          compression-level: 0
      - name: Run X-01
        env:
          RUNS: ${{ inputs.runs || '100' }}
        run: bash infra/experiments/x01/run.sh jude-x01:exp out/ci "$RUNS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: x01-ci
          path: out/ci
          retention-days: 90
