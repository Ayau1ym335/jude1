# XC-EXP-08 (X-08, TQ-09): build the candidate worker image on a GitHub-hosted runner and
# record build times, cold-process import/JIT times and the SOUP list. Manual only.
name: x08-image-matrix

on:
  # PRs that touch the experiment run it once with the defaults (dispatch needs the file on main).
  pull_request:
    paths:
      - "infra/experiments/x08/**"
      - ".github/workflows/x08.yml"
  workflow_dispatch:
    inputs:
      builds:
        description: "Number of --no-cache builds"
        default: "3"
      runs:
        description: "Number of probe runs"
        default: "20"

permissions:
  contents: read

jobs:
  x08:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pull pinned base images
        run: |
          docker pull --platform linux/amd64 python:3.12.16-slim-bookworm@sha256:935c3c5b12357a7e10caa9c1e6ca5692344d97cf229832ef584be2cec9fc03df
          docker pull --platform linux/amd64 ghcr.io/astral-sh/uv:0.10.6@sha256:2f2ccd27bbf953ec7a9e3153a4563705e41c852a5e1912b438fc44d88d6cb52c
      - name: Run X-08
        env:
          BUILDS: ${{ inputs.builds || '3' }}
          RUNS: ${{ inputs.runs || '20' }}
        run: bash infra/experiments/x08/run.sh out/ci "$BUILDS" "$RUNS"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: x08-ci
          path: out/ci
          retention-days: 90
