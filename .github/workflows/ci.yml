# Staged CI pipeline, merge-blocking stages (XC-FND-03; GEOMETRY_TESTING_STRATEGY §7,
# DEVELOPMENT_TEST_PLAN §5). Every job calls `scripts/ci/stage.sh <stage>`, the same command
# as a local run. Required checks on main: the job names below (docs/ops/CI_PIPELINE.md).
# Release-blocking and report-only stages are in nightly.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.6"
  PNPM_VERSION: "12.21.0"
  JUDE_CI_REPORTS: reports

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g --no-fund --no-audit pnpm@${{ env.PNPM_VERSION }}
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage lint
        run: bash scripts/ci/stage.sh lint
      - name: commitlint (PR commits)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE" --to "$HEAD" --verbose
      - name: commitlint (pushed commits)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            pnpm exec commitlint --last --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      # Web component tests run in this stage too (TSK-IAM-01-U).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g --no-fund --no-audit pnpm@${{ env.PNPM_VERSION }}
      - run: pnpm install --frozen-lockfile
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage unit
        run: bash scripts/ci/stage.sh unit
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-reports
          path: reports/
          retention-days: 30

  determinism:
    name: determinism
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage determinism
        run: bash scripts/ci/stage.sh determinism
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: determinism-reports
          path: reports/
          retention-days: 30

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the breaking-change check reads the contract at the base commit
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g --no-fund --no-audit pnpm@${{ env.PNPM_VERSION }}
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Base commit for the breaking-change check
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^1)"
          fi
          echo "JUDE_CONTRACT_BASE=$base" >> "$GITHUB_ENV"
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage contract
        run: bash scripts/ci/stage.sh contract

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_PASSWORD: jude_it_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      JUDE_TEST_ADMIN_URL: postgresql://postgres:jude_it_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --locked
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage integration
        run: bash scripts/ci/stage.sh integration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-reports
          path: reports/
          retention-days: 30

  smoke:
    name: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Seed (demonstration PRs only)
        run: if [ -f .github/ci-seed ]; then echo "JUDE_CI_SEED=$(tr -d '[:space:]' < .github/ci-seed)" >> "$GITHUB_ENV"; fi
      - name: Stage smoke
        run: bash scripts/ci/stage.sh smoke
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color > reports/compose.log 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-logs
          path: reports/
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  ci-selftest:
    name: ci-selftest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
        env:
          POSTGRES_PASSWORD: jude_it_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      JUDE_TEST_ADMIN_URL: postgresql://postgres:jude_it_only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm install -g --no-fund --no-audit pnpm@${{ env.PNPM_VERSION }}
      - run: uv sync --locked
      - run: pnpm install --frozen-lockfile
      - name: Lint rules reject seeded violations (XC-FND-04)
        run: uv run --frozen pytest -m lint_selftest
      - name: Every stage fails on its seeded failure (XC-FND-03)
        run: bash scripts/ci/selftest.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ci-selftest-logs
          path: reports/selftest/
          retention-days: 14
