# CI smoke job (XC-FND-02): lockfiles are consistent, unit tests pass, and the whole
# local stack starts with every health endpoint returning 200.
# The staged pipeline (lint, unit, determinism, integration, oracle, security, e2e,
# performance) and branch protection are XC-FND-03.
name: smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.6"

      - name: Python dependencies match uv.lock
        run: uv sync --locked

      - name: Python unit tests
        run: uv run pytest

      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up --build --detach --wait --wait-timeout 300

      - name: Health endpoints return 200
        run: bash scripts/smoke.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
