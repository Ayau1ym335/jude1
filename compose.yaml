# Local development stack (XC-FND-02). Synthetic data only — never real scans (SEC-17, EXT-01).
# Usage: cp .env.example .env && docker compose up --build --wait   (or: just up)
name: jude

x-python-service: &python-service
  platform: linux/amd64
  read_only: true
  tmpfs: [/tmp]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-python-build: &python-build
  context: .
  dockerfile: infra/docker/python.Dockerfile

x-database-url: &database-url "postgresql://jude:${JUDE_DB_PASSWORD:?copy .env.example to .env}@postgres:5432/jude"

services:
  postgres:
    image: postgres:17.12-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    platform: linux/amd64
    environment:
      POSTGRES_DB: jude
      POSTGRES_USER: jude
      POSTGRES_PASSWORD: ${JUDE_DB_PASSWORD:?copy .env.example to .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jude -d jude"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  storage-fake:
    <<: *python-service
    build:
      <<: *python-build
      args: { PACKAGE: jude-storage-fake }
    image: jude/storage-fake:dev
    command: ["jude-storage-fake"]
    environment:
      JUDE_STORAGE_ROOT: /var/lib/jude/blobs
      JUDE_STORAGE_PORT: "9000"
    volumes:
      - blobdata:/var/lib/jude
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  # One-shot: apply forward-only migrations (XC-FND-05) before api/worker start.
  # Dev runs them as the database owner; deployment uses its own owner credential (XC-FND-07).
  migrate:
    <<: *python-service
    build:
      <<: *python-build
      args: { PACKAGE: jude-api }
    image: jude/api:dev
    command: ["jude-migrate", "upgrade"]
    restart: "no"
    environment:
      JUDE_DATABASE_URL: *database-url
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *python-service
    build:
      <<: *python-build
      args: { PACKAGE: jude-api }
    image: jude/api:dev
    command: ["uvicorn", "jude_api.main:build", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-server-header", "--no-access-log"]
    environment:
      JUDE_DATABASE_URL: *database-url
      JUDE_STORAGE_URL: http://storage-fake:9000
    depends_on:
      postgres: { condition: service_healthy }
      storage-fake: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  worker:
    <<: *python-service
    build:
      <<: *python-build
      args: { PACKAGE: jude-worker }
    image: jude/worker:dev
    command: ["jude-worker"]
    environment:
      JUDE_DATABASE_URL: *database-url
      JUDE_STORAGE_URL: http://storage-fake:9000
      JUDE_WORKER_HEALTH_PORT: "8001"
    depends_on:
      postgres: { condition: service_healthy }
      storage-fake: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: jude/web:dev
    platform: linux/amd64
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

  proxy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    platform: linux/amd64
    ports:
      - "127.0.0.1:${JUDE_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/proxy-healthz"]
      interval: 5s
      timeout: 4s
      retries: 20
    restart: unless-stopped

volumes:
  pgdata:
  blobdata:
